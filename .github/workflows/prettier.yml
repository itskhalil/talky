name: "prettier"

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check:frontend

  # Separate job so a prettier failure can never hide a rustfmt failure.
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Pinned: rustfmt output changes between Rust releases, and the
      # runner image's default toolchain moves without warning.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          components: rustfmt

      - name: Check backend formatting
        working-directory: src-tauri
        run: cargo fmt --check
